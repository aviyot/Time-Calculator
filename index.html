<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate and sum hours, minutes, and seconds easily with a sleek multiplier.">
    <title>Time Sum Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Backdrop Glow Blobs -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="calculator-card">
        <header>
            <h1>Time Sum Calculator</h1>
        </header>

        <!-- Digital Result Display -->
        <div class="result-container">
            <div class="result-label">Total Duration</div>
            <div id="calc-result" class="result-time">00:00:00</div>
            <div id="calc-desc" class="result-description">0 hours, 0 minutes, 0 seconds</div>
        </div>

        <!-- Unified Column Header & Toggles (H, M, S) -->
        <div class="toggle-bar">
            <button class="toggle-btn active" id="hourTog" title="Toggle Hours">Hours</button>
            <button class="toggle-btn active" id="minuteTog" title="Toggle Minutes">Minutes</button>
            <button class="toggle-btn active" id="secondTog" title="Toggle Seconds">Seconds</button>
        </div>

        <!-- Times Scrollable Container -->
        <div id="times-wrapper" class="times-container">
            <!-- Rows list (injected by main.js) -->
            <div class="times"></div>
        </div>

        <!-- Add Row & Actions Bar -->
        <div class="add-row-section">
            <button class="primary-btn" id="add-time-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                <span>Add Row</span>
            </button>
            <button type="button" id="global-menu-btn" class="global-menu-btn" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="19" r="2" />
                </svg>
            </button>
        </div>

    </div>
    <!-- Floating Global Actions Menu -->
    <div id="global-menu" class="row-menu hidden" role="menu" aria-hidden="true">
        <button type="button" id="reset-times-btn" class="row-menu-item row-menu-clear" role="menuitem">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.656 48.656 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3M3 12a48.291 48.291 0 0 0 .138 3.662 4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M3 12l-3 3m3-3 3 3" />
            </svg>
            <span>Clear Values</span>
        </button>
        <div class="row-menu-divider"></div>
        <button type="button" id="del-times-btn" class="row-menu-item row-menu-delete" role="menuitem">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.24 9m4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
            <span>Delete All</span>
        </button>
    </div>
    <!-- Floating Row Actions Menu -->
    <div id="row-menu" class="row-menu hidden" role="menu" aria-hidden="true">
        <label class="row-menu-item row-menu-mul-row" for="row-menu-mul">
            <span>Multiplier</span>
            <div class="row-menu-mul-wrap">
                <span class="mul-symbol">×</span>
                <input id="row-menu-mul" class="row-menu-mul-input" type="number" min="1" step="any" value="1" />
            </div>
        </label>
        <div class="row-menu-divider"></div>
        <button type="button" id="row-menu-delete" class="row-menu-item row-menu-delete" role="menuitem">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.24 9m4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
            <span>Delete Row</span>
        </button>
    </div>
    <script src="./main.js"></script>
</body>
</html>
